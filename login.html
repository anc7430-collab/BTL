<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tiệm Sách Online</title>
    <link rel="stylesheet" href="baitaplon.css">
</head>
<body>
    <!-- Header chung -->
    <header>
        <div class="logo"> Tiệm Sách Online</div>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="cart.html">🛒 Giỏ hàng</a>
            <a href="login.html" class="active admin-link">Đăng nhập</a>
        </nav>
    </header>

    <!-- Nội dung form đăng nhập -->
    <main class="container-login">
        <div class="login-card">
            <div class="login-tabs">
                <span class="tab active">Đăng nhập</span>
                <span class="tab">Đăng ký</span>
            </div>
            
            <form>
                <div class="form-group">
                    <label>Số điện thoại/Email</label>
                    <input type="text" placeholder="Nhập số điện thoại hoặc email" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="form-forgot">
                    <a href="#">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>
        </div>
    </main>

</body>
</html>
